; IrisArsenal 0.4.45：保守角色查询；配置可控制长期、Hook与资源性能日志。
[IrisArsenal]
Enabled=1
; 052：游戏回调写日志，无轮询/后台线程，不设日志总行数上限；改后重启生效。
EnableLogging=1
; 关闭后不采集新增高频帧/查询/医疗统计，资源阶段由下一项单独控制。
EnablePerformanceLogging=1
; 078十六入口调用/总回调/进锁审计，本轮测试开启；需日志和性能开关同时为1。
; 设1后原子累计并抽样计时，按既有摘要窗口输出；不从每次Hook写文件，不是FPS测量。
EnableHookAuditLogging=1
; 每N次全回调抽样总墙钟，另按N次进锁抽样等待/保护段；unsigned整数，0不抽样，重启生效。
HookAuditSampleEvery=128
; 078本轮性能测试开启16入口抽样，每128次全回调/进锁各自采样，重启生效。
; 回调总耗时包含原生/嵌套，不可相加当FPS；测试结束可将EnableHookAuditLogging改0。
; 055明细：碰撞去重/任务/医疗分阶段与观察点等待；需上两项同时为1，关闭不影响战斗/预算。
EnableCombatDetailLogging=1
; 104片尾审计：需总日志/性能/明细均为1；缺项0，改后重启。只追踪，不补发伤害。
; due_pending为当前快照已到期却未消费；time_known=0时不能断言漏发。每类前32条及每256次汇总。
EnableActionEndLogging=1
; 087本地测试：碰撞/名单/路径/附件分阶段；需总日志、性能、明细同时为1，缺项默认0。
; 0关闭新增计时/计数；不改变优化、物理查询或医疗预算。按既有摘要输出，无逐形体日志。
EnableCollisionDetailProfiling=1
; 091本地测试：细分战斗Tick/医疗Flush未归因阶段；不改变调度或查询，缺项默认0。
; 设0后新追踪不取QPC、不计抽样原子、不汇总加锁；未抽中的调用也不读新时钟。
EnableWorkPhaseProfiling=1
; 原生受击已知探针之间的空白时段，复用原时间戳；还须EnableNativeHitProfiling=1。
; 不新增原生Hook/医疗操作；间隙只标时间位置，不将未知函数当已确认瓶颈。
EnableNativeGapProfiling=1
; 首次及每N次抽样，unsigned整数，0不抽样；32控制轻负载诊断成本，深查可暂设1，发布设上述两项0。
WorkPhaseSampleEvery=32
; 092本地深度监视：完整战斗Tick所有调用逐层归因，不再依赖上述N32样本。
; 程序缺项0；0或父日志关闭时不读新TLS/QPC、不进新增统计锁、不扫描其他角色。
; 1有计时观察成本；接口只写当前栈，根退出统一汇总。实际FPS对照可设0。
EnableCombatInterfaceProfiling=1
; 093查询边界深查：需完整接口及日志/性能/明细开启，程序缺项0。
; 按批/报告块拆submit/execute/finish/report；不逐形体日志，0不增加对应TLS/QPC。
EnableQueryBoundaryProfiling=1
; 097：此开关仅控制球形爆炸和光柱的保守模式；胶囊固定使用原生AABB overlap。
; 球/胶囊的查询体半径不变；三远程真实弹体停止点和地形有限射线保持。
; 全力前两刀使用原生cullShapes的AABB结果，允许额外命中；每片<=90度且只查询动画新增角度。
EnableConservativeDamageQueries=1
; 诊断缺项0；本地测试1，仍需日志/性能/明细父门。0不增加此通道时钟/统计锁/异常日志。
; 摘要记录查询/候选/最终去重名单/盒检查/各类跳过；原sphere/cylinder与医疗/队列统计用于核对总收益。
EnableConservativeQueryLogging=1
; 097移除旧自写扩盒内核及095对照；不再读取KernelReuse/ProofAudit/SampleEvery。
; sector_native_cull与sector_*工作量需日志/性能/明细及EnableCollisionDetailProfiling=1。
; sector_path样本需日志/性能/明细=1；首次8条后最多每10秒1条，关闭总日志不读新增诊断时钟。

; 093功能开关，独立于日志：0回原骨架搜索，1仅在当前骨骼扫描内复用子节点数量。
; 保持原扫描顺序/谓词/预算，不跨帧缓存Ogre对象，不调用不兼容的附件迭代器。
EnableAttachmentCountReuse=1
; 0回原整组custom提交；1仅对本实例成功提交后逐位相同的候选轨道组省写。
; 自有CPU缓存随Visual清理，分配失败沿原路径；不改变动画/特效/Shader。
EnableVisualParameterGroupReuse=1
; 慢根首次4条、以后每10秒最多一条；全量统计仍按原摘要输出，毫秒，数值直接读取。
CombatInterfaceSlowMs=2
; 092按已提交远程批记录total/rays/body/probe/输入长度半径/命令/省查/失败；程序缺项0。
EnableRangedProbeCostLogging=1
; 显式实验：相邻合格球扫掠批交替有/无单条空区宽相；不重放，不增加参考查询。
; 仅测试policy.single，原精确扫掠/地形/几何/逐段命中不变；圆柱/shadow/非空间策略不参与。
; 需上项及日志/性能/明细=1；0完全沿原EnableRangedSingleEmptyProbe配置，发布/日常可设0。
; 两组实际输入仍不同，必须比较输入数量/长度和总成本，不能只数saved_sweeps。
; 092现场A/B三个窗口均支持single，093恢复按原single=1常开，停止一半批次关闭的实验。
; 如需复测仍可显式设1；这只是试验开关，不关闭成本监视。
EnableRangedSingleProbeABTest=0
; 082本轮安全窗口测试开启：分阶段记录线程运行/队列未清/AI运行；需日志、性能、明细同时为1。
; 0关闭新增探测/QPC/摘要；明细首次8条、变化至少1秒、持续10秒，阶段数量按原摘要累计。
EnableWindowAuditLogging=1
; 084逐笔原生受击分项，需日志/性能/明细均为1；程序缺省0。仅本地测试开启，发布副本设0。
EnableNativeHitProfiling=1
; 085本地伤口细分/桥接外对照；需日志/性能/明细/原生探针均为1，程序缺省0。
; 0不安装四个新增Hook；不改变受击、伤害飘字、血液、护甲或2.5ms/32/FIFO。
EnableWoundDetailProfiling=1
; 086仅本地测试开启：细分断肢/造物/倒地/状态更新；发布可设0，仍须父日志开关。
EnableWoundBranchProfiling=1
; 084只观察既有安全回调与批间等待，不改变每帧一次更新/2.5ms/32/FIFO；程序缺省0。
EnableServiceOpportunityLogging=1
; 080仅隐藏插件特效网格/刀光作GPU负载对照；0正常、1隐藏，启动读取，修改后重启。
; 动画/武器本体、资源预热、CPU特效更新、碰撞/伤害/时钟不变；对照模式不代表纯GPU计时。
DiagnosticHideEffects=0
; 080摘要增加visual_update和省略查询/资格/custom参数计数；关闭总日志则不采集。
; 097胶囊复合提交开关：1同窗集中处理，0逐路径；二者都用原生overlap(false)，保留64查询预算。
EnableCapsuleBatching=1
; 088：同一安全窗口集中提交连续远程查询；0回到原逐条查询，启动读取，无新线程。
; 光炮只批量环境射线，角色圆柱保留原accurateCollision=true精确链；不改变范围/伤害。
EnableRangedQueryBatching=1
; 089：仅本批同场景/同组、完整float位参数相同的成功查询可复用，不合并伤害。
EnableRangedQueryReuse=1
; 完整扫掠包围盒内没有任何角色时省略球扫掠；可能命中/异常仍原SDK精确查询。
; 不跨帧缓存；0完全关闭空区省查。090分组规则见下；空间开关0才使用089整批规则。
EnableRangedEmptyPruning=1
; 090：当前批最多8条按包围盒空间邻近聚组；0回089整批策略，原输入/事件顺序不动。
EnableRangedSpatialPruning=1
; 单段宽相是成本测试路径：1以一次宽相证明空时替代一次球扫掠，非空则多一次宽相。
; 0仅检测可成组路径；所有试探和保留的原精确查询均计入同一64查询预算。
; 本地调试显式1，程序缺项0；需同时看ranged_empty_probe与ranged_batch_bodies和队列等待。
EnableRangedSingleEmptyProbe=1
; 仅自然命中/射程终止时每弹汇总一次查询/空结果/等待/飞行秒；关闭不更新逐弹计数。
; 同时依赖EnableLogging、EnablePerformanceLogging、EnableCombatDetailLogging。
EnableProjectileWorkLogging=1
; 活动弹体不设人为数量上限；空闲可视缓存最多96，物理64预算/原医疗FIFO保持。
; 仅测试：1仍执行原扫掠验证空区结论；0不做额外新旧对照（正式/日常默认0）。
EnableRangedEmptyShadow=0
; 089耗时/省查/原路/异常计数仍由EnableCollisionDetailProfiling及日志/性能/明细父门控制。
; 批量创建/射线/体积/释放、真实查询数与未消费项由EnableCollisionDetailProfiling控制。
; 诊断关闭不关闭优化；胶囊仍由EnableCapsuleBatching控制，旧对照开关保持默认0。
; 097胶囊只做原生逐条复合提交，旧EnableCapsuleBatchShadow不再读取，正常无影子重查。
; 原生受击慢调用的墙钟阈值毫秒（INI直接取值），只控制诊断，需明细/性能/日志同时启用。
NativeHitSlowMs=1.0
EnableResourceLogging=1
; 墙钟秒：定期输出窗口和进程累计，暂停仍可输出纯值摘要。
LogSummarySeconds=60
LogFlushSeconds=2
; 安全更新耗时阈值，单位毫秒；每个超阈值样本均可记录，不代表FPS。
SlowFrameThresholdMs=8
; 2026-10-26群伤测试配置：按用户要求使用20ms软预算；没有任务时不会强制耗满预算。
; 单位毫秒，不设业务上下限；代码缺项默认2.5，单次原生受击不可抢占，可能略超预算。
DamageFlushBudgetMs=20
; 40ms仅作为排队监视目标，含暂停的墙钟时间；不丢弃超标请求，也不跳过安全检查。
DamageQueueTargetMs=40
; 本次每轮原生受击配置128次；INI读取不设业务上下限，原循环另保留256项扫描边界。
; 128是兜底次数，不代表每轮强制执行128次，也不是物理查询次数上限。
DamageFlushMaxHits=128
; 099追赶代码保留，本轮明确关闭；所有队列统一20ms/128，不再按40ms年龄切换额度。
; 原FIFO、主线程安全窗口、逐笔世界/物理/AI/暂停/身份/资格检查保持；不新增线程或carry。
EnableDamageBacklogCatchup=0
; 以下5ms/64只是关闭状态下保留的备用追赶请求值，当前不会叠加或覆盖统一20ms/128额度。
; 若以后启用追赶，需成组复核普通与追赶参数；不能仅开功能就假定会增加当前额度。
DamageCatchupBudgetMs=5
DamageCatchupMaxHits=64
; 追赶专用日志门保留；当前功能关闭，因此不产生追赶批次。全体伤害/队列性能日志继续开启。
; 此诊断开关不控制功能；发布时可关闭父日志门。
EnableDamageCatchupLogging=1
; 100实测（2026-10-26）：1876次复核、额外放行0，本轮几乎没有优化效果。
; 检查本体累计0.417ms，未发现明显性能损失；按用户要求保留代码和当前开启值，不回退。
; 本结论不代表绝对零开销或其他场景一定无效，不能声称已改善FPS/查询等待。
; 100仅旧队列门false后尝试精细放行；0恢复原门。真实待创建/销毁/地形/状态消息仍等待。
EnableQueryGateRefinement=1
; 需总日志+性能+战斗明细同时开启；关闭不影响功能，不增加新计时/统计/明细IO。
EnableQueryGateLogging=1
